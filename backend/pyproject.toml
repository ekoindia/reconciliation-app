[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "venv", "uploads", "__pycache__"]

[tool.ruff.lint]
# Start pragmatic: correctness-focused rules only. The codebase predates the
# linter — style rules can be tightened gradually.
select = ["E9", "F"]
ignore = [
    "F401", # unused imports — several modules re-export for side effects
    "F841", # unused locals — common in exploratory recon diagnostics
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Bare `pytest` (unlike `python -m pytest`) doesn't put backend/ on sys.path;
# tests import `core.*`, so add it explicitly.
pythonpath = ["."]
