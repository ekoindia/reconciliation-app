name: Secret Scan

# Scans for committed secrets (API keys, tokens, private keys) per the Eko
# open-source guidelines (secret-scanning-guide.md).

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org/private repos require an org-level GITLEAKS_LICENSE secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
